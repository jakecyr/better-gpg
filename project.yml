name: GPGeze

options:
  bundleIdPrefix: com.gpgeze
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  GPGeze:
    type: application
    platform: macOS
    sources:
      - GPGeze/Sources
    resources:
      - GPGeze/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpgeze.app
        PRODUCT_NAME: GPGeze
        INFOPLIST_FILE: GPGeze/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: GPGeze/GPGeze.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
