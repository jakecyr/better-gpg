name: GPGeze

options:
  bundleIdPrefix: com.gpgeze
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Automatic signing — Xcode will use your development certificate.
    # Extensions require a real (even free) certificate; ad-hoc signing blocks extension loading.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  GPGeze:
    type: application
    platform: macOS
    sources:
      - GPGeze/Sources
    resources:
      - GPGeze/Resources/Assets.xcassets
    dependencies:
      - target: GPGezeFinderExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpgeze.app
        PRODUCT_NAME: GPGeze
        INFOPLIST_FILE: GPGeze/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: GPGeze/GPGeze.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  GPGezeFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - GPGeze/FinderExtension/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpgeze.app.findersync
        PRODUCT_NAME: GPGezeFinderExtension
        INFOPLIST_FILE: GPGeze/FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: GPGeze/FinderExtension/GPGezeFinderExtension.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
