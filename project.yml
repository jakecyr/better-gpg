name: BetterGPG

options:
  bundleIdPrefix: com.better-gpg
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Automatic signing — Xcode will use your development certificate.
    # Extensions require a real (even free) certificate; ad-hoc signing blocks extension loading.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  BetterGPG:
    type: application
    platform: macOS
    sources:
      - BetterGPG/Sources
      - path: BetterGPG/Resources
        type: group
        excludes:
          - "Info.plist"
    resources:
      - BetterGPG/Resources/Assets.xcassets
    dependencies:
      - target: BetterGPGFinderExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.better-gpg.app
        PRODUCT_NAME: BetterGPG
        INFOPLIST_FILE: BetterGPG/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BetterGPG/BetterGPG.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"

  BetterGPGFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - BetterGPG/FinderExtension/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.better-gpg.app.findersync
        PRODUCT_NAME: BetterGPGFinderExtension
        INFOPLIST_FILE: BetterGPG/FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BetterGPG/FinderExtension/BetterGPGFinderExtension.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
